name: Skill Metadata Lint

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  skill-metadata:
    name: Validate skill metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate skill metadata
        run: node scripts/lint-skill-metadata.mjs

      - name: Run skill contract tests
        run: |
          set -euo pipefail
          for file in scripts/test-*.mjs; do
            node "$file"
          done
          node skills/make-ai-assistant/scripts/test-audit-make-ai-assistant-project.mjs
          node skills/make-app-observability/scripts/test-audit-trace-contract.mjs
          node skills/make-app-auth/scripts/test-current-context-conformance-suite.mjs
          node skills/make-app-auth/scripts/test-audit-auth-contract.mjs
          node skills/make-app-permission/scripts/test-permission-registry.mjs
          node skills/make-app-permission/scripts/test-platform-permission-contract.mjs
          node skills/make-app-permission/scripts/test-permission-conformance-suite.mjs
          node skills/make-app-permission/scripts/test-write-permission-conformance-suite.mjs
          node skills/make-app-permission/scripts/test-audit-make-app-permission.mjs
          node --test skills/make-app-permission/scripts/test-permission-runtime-signals.mjs
          node --test skills/make-app-permission/scripts/test-create-payload-signals.mjs
          node --test skills/make-app-permission/scripts/test-scoped-route-feedback.mjs

      - name: Check feedback package and SDK compatibility
        run: |
          npm exec --yes --ignore-scripts --package=typescript@5.9.3 \
            --package=react@19.2.8 --package=react-dom@19.2.8 -- sh -ec '
            export MAKE_FEEDBACK_TEST_DEPENDENCIES="$(dirname "$(dirname "$(command -v tsc)")")"
            node --test skills/make-app-observability/scripts/test-audit-error-outlets.mjs
            node --test skills/makeui/scripts/test-verify-feedback-package-surface.mjs
            node skills/makeui/scripts/test-feedback-sdk-types.mjs "$(command -v tsc)"
          '
