name: Skill Metadata Lint

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  skill-metadata:
    name: Validate skill metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate skill metadata
        run: node scripts/lint-skill-metadata.mjs

      - name: Run skill contract tests
        run: |
          set -euo pipefail
          for file in scripts/test-*.mjs; do
            node "$file"
          done
          node skills/make-ai-assistant/scripts/test-prepare-gateway-fixture.mjs
          node skills/make-app-observability/scripts/test-audit-trace-contract.mjs
          node skills/make-app-auth/scripts/test-current-context-conformance-suite.mjs
          node skills/make-app-auth/scripts/test-auth-audit-portable-copy.mjs
          node skills/make-app-permission/scripts/test-permission-registry.mjs
          node skills/make-app-permission/scripts/test-platform-permission-contract.mjs
          node skills/make-app-permission/scripts/test-permission-conformance-suite.mjs
          node skills/make-app-permission/scripts/test-write-permission-conformance-suite.mjs
          node skills/make-app-permission/scripts/test-audit-make-app-permission.mjs
          node --test skills/make-app-permission/scripts/test-permission-runtime-signals.mjs
          node --test skills/make-app-permission/scripts/test-create-payload-signals.mjs
          node --test skills/make-app-permission/scripts/test-administrator-feedback-audit.mjs
          node --test skills/make-app-permission/scripts/test-administrator-feedback-conformance-suite.mjs
          node --test skills/make-app-permission/scripts/test-scoped-route-feedback.mjs

      - name: Execute analytics Skill examples against released 0.1.9
        run: |
          npm exec --yes --ignore-scripts \
            --package=@qfei-design/make-app-analytics@0.1.9 --package=react@19.2.9 --package=react-dom@19.2.9 \
            -- node scripts/test-analytics-release-examples.mjs --installed

      - name: Compile and render the distributed Ant Design foundation
        run: |
          npm exec --yes --ignore-scripts \
            --package=typescript@5.9.3 --package=esbuild@0.28.2 \
            --package=antd@6.7.2 --package=dayjs@1.11.20 --package=lucide-react@1.47.0 \
            --package=react@19.3.0 --package=react-dom@19.3.0 \
            --package=@types/react@19.3.0 --package=@types/react-dom@19.3.0 \
            --package=jsdom@29.1.1 -- sh -ec '
            makeui_foundation_dependencies="$(dirname "$(dirname "$(command -v tsc)")")"
            node scripts/test-makeui-antd-foundation.mjs \
              --dependencies="$makeui_foundation_dependencies" \
              --dom-dependencies="$makeui_foundation_dependencies"
          '

      - name: Check Ant Design foundation with React 18 StrictMode
        run: |
          npm exec --yes --ignore-scripts \
            --package=typescript@5.9.3 --package=esbuild@0.28.2 \
            --package=antd@6.7.2 --package=dayjs@1.11.20 --package=lucide-react@1.47.0 \
            --package=react@18.2.0 --package=react-dom@18.2.0 \
            --package=@types/react@18.2.79 --package=@types/react-dom@18.2.25 \
            --package=jsdom@29.1.1 -- sh -ec '
            makeui_foundation_peer_dependencies="$(dirname "$(dirname "$(command -v tsc)")")"
            node scripts/test-makeui-antd-foundation.mjs \
              --dependencies="$makeui_foundation_peer_dependencies" \
              --dom-dependencies="$makeui_foundation_peer_dependencies"
          '

      - name: Exercise controlled record-page examples and mobile acceptance guards
        run: |
          npm exec --yes --ignore-scripts \
            --package=typescript@5.9.3 --package=esbuild@0.28.2 \
            --package=antd@6.7.2 --package=dayjs@1.11.20 --package=lucide-react@1.47.0 \
            --package=react@19.3.0 --package=react-dom@19.3.0 \
            --package=@types/react@19.3.0 --package=@types/react-dom@19.3.0 \
            --package=@qfei-design/make-app-mobile@0.1.16 \
            --package=@testing-library/react@16.3.0 --package=@testing-library/dom@10.4.2 \
            --package=jsdom@29.1.1 -- sh -ec '
            makeui_record_dependencies="$(dirname "$(dirname "$(command -v tsc)")")"
            node scripts/test-makeui-generated-page-acceptance.mjs --dependencies="$makeui_record_dependencies"
            node scripts/test-makeui-record-page-patterns.mjs --dependencies="$makeui_record_dependencies"
            node scripts/test-makeui-record-search.mjs --dependencies="$makeui_record_dependencies"
            node scripts/test-host-mobile-record-value.mjs --dependencies="$makeui_record_dependencies"
            node scripts/test-makeui-field-label-association.mjs --dependencies="$makeui_record_dependencies"
          '

      - name: Check feedback package and SDK compatibility
        run: |
          npm exec --yes --ignore-scripts --package=typescript@5.9.3 \
            --package=react@19.2.8 --package=react-dom@19.2.8 --package=jsdom@29.1.1 -- sh -ec '
            export MAKE_FEEDBACK_TEST_DEPENDENCIES="$(dirname "$(dirname "$(command -v tsc)")")"
            node --test --test-name-pattern="App shell mounts" scripts/test-resource-content-feedback-contract.mjs
            node --test skills/make-app-observability/scripts/test-audit-error-outlets.mjs
            node --test skills/makeui/scripts/test-verify-feedback-package-surface.mjs
            node skills/makeui/scripts/test-feedback-sdk-types.mjs "$(command -v tsc)"
            node --test skills/makeui/scripts/test-mobile-form-acceptance-dom.mjs
          '

      - name: Check Agent and auth source-binding audits
        run: |
          npm exec --yes --ignore-scripts --package=typescript@5.9.3 -- sh -ec '
            skill_audit_dependencies="$(dirname "$(dirname "$(command -v tsc)")")"
            node skills/make-ai-assistant/scripts/test-load-agent-compiler.mjs "$skill_audit_dependencies"
            node skills/make-ai-assistant/scripts/test-audit-make-ai-assistant-project.mjs "$skill_audit_dependencies"
            node skills/make-app-auth/scripts/test-audit-auth-contract.mjs "$skill_audit_dependencies"
            node skills/make-app-auth/scripts/test-service-fronted-doc-examples.mjs "$skill_audit_dependencies"
          '

      - name: Check Agent tooling with native TypeScript 7
        run: |
          npm exec --yes --ignore-scripts --omit=optional --registry=https://registry.npmjs.org/ \
            --package=typescript@7.0.2 --package=@typescript/typescript6@6.0.2 \
            --package=@qfei-design/make-ai-assistant@0.4.6 \
            --package=react@19.2.6 --package=react-dom@19.2.6 \
            --package=@types/react@19.2.14 --package=@types/react-dom@19.2.3 -- sh -ec '
            agent_compiler_dependencies="$(dirname "$(dirname "$(command -v tsc)")")"
            node skills/make-ai-assistant/scripts/test-load-agent-compiler.mjs "$agent_compiler_dependencies"
            node skills/make-ai-assistant/scripts/test-audit-make-ai-assistant-project.mjs "$agent_compiler_dependencies"
            node skills/make-ai-assistant/scripts/verify-host-example.mjs "$agent_compiler_dependencies"
            node skills/make-app-auth/scripts/test-audit-auth-contract.mjs "$agent_compiler_dependencies"
            MAKE_FEEDBACK_TEST_DEPENDENCIES="$agent_compiler_dependencies" node --test skills/make-app-observability/scripts/test-audit-error-outlets.mjs
          '

      - name: Check error outlet audit with legacy TypeScript
        run: |
          npm exec --yes --ignore-scripts --package=typescript@4.8.4 -- sh -ec '
            export MAKE_FEEDBACK_TEST_DEPENDENCIES="$(dirname "$(dirname "$(command -v tsc)")")"
            node --test --test-name-pattern="保留唯一全局出口|catch 中将请求异常|JSON 本地解析|缺少 satisfies API" skills/make-app-observability/scripts/test-audit-error-outlets.mjs
          '

      - name: Check official Agent package and documented host example
        run: |
          npm exec --yes --ignore-scripts --registry=https://registry.npmjs.org/ \
            --package=typescript@5.9.3 --package=@qfei-design/make-ai-assistant@0.4.6 \
            --package=jsdom@29.1.1 \
            --package=react@19.2.6 --package=react-dom@19.2.6 \
            --package=@types/react@19.2.14 --package=@types/react-dom@19.2.3 -- sh -ec '
            agent_test_dependencies="$(dirname "$(dirname "$(command -v tsc)")")"
            node skills/make-ai-assistant/scripts/verify-agent-package.mjs "$agent_test_dependencies"
            node skills/make-ai-assistant/scripts/test-verify-agent-package.mjs "$agent_test_dependencies"
            node skills/make-ai-assistant/scripts/verify-host-example.mjs "$agent_test_dependencies"
            node skills/make-ai-assistant/scripts/verify-agent-ui.mjs "$agent_test_dependencies"
          '

      - name: Check Agent UI with minimum React peer version
        run: |
          npm exec --yes --ignore-scripts --registry=https://registry.npmjs.org/ \
            --package=typescript@5.9.3 --package=@qfei-design/make-ai-assistant@0.4.6 \
            --package=jsdom@29.1.1 --package=react@18.2.0 --package=react-dom@18.2.0 -- sh -ec '
            agent_test_dependencies="$(dirname "$(dirname "$(command -v tsc)")")"
            node skills/make-ai-assistant/scripts/verify-agent-ui.mjs "$agent_test_dependencies"
          '

      - name: Check official Agent terminal notice contract
        if: ${{ !cancelled() }}
        run: |
          npm exec --yes --ignore-scripts --registry=https://registry.npmjs.org/ \
            --package=typescript@5.9.3 --package=@qfei-design/make-ai-assistant@0.4.6 -- sh -ec '
            agent_notice_dependencies="$(dirname "$(dirname "$(command -v tsc)")")"
            node skills/make-ai-assistant/scripts/verify-agent-terminal-notice.mjs "$agent_notice_dependencies"
          '
